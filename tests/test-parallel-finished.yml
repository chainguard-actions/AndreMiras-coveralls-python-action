name: Test parallel-finished webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          parallel-finished: "true"
          debug: "true"

      - name: Assert action ran (parallel-finished webhook attempt)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action calls post_webhook() which POSTs to coveralls.io/webhook.
          # Under the harness the GITHUB_REPOSITORY is a sentinel that does not
          # exist on coveralls.io, so the webhook call will fail or return an error.
          # Either success (if coveralls accepts the token) or failure (graceful) is valid.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: webhook posted successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — sentinel repo / invalid token for coveralls.io)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
