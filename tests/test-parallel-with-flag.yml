name: Test parallel mode with flag-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal coverage file
        run: |
          pip install coverage
          python -c "
          import coverage
          cov = coverage.Coverage(data_file='.coverage')
          cov.start()
          x = 1 + 1
          cov.stop()
          cov.save()
          "
          ls -la .coverage

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          parallel: "true"
          flag-name: "unit-tests"
          debug: "true"

      - name: Assert action ran with parallel and flag-name inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action tries to submit coverage to coveralls.io with parallel=true
          # and flag-name="unit-tests". Under the harness the coveralls.io API call
          # will fail (no valid coverage data / sentinel repo), but the action should
          # exit cleanly (not crash with an unhandled exception).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: coverage submitted successfully with parallel flag"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — sentinel repo / no valid coverage)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
