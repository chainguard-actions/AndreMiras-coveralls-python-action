name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal coverage file
        run: |
          pip install coverage
          python -c "
          import coverage
          cov = coverage.Coverage()
          cov.start()
          x = 1 + 1
          cov.stop()
          cov.save()
          "
          ls -la .coverage

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          debug: true

      - name: Assert action ran and failed gracefully (coveralls.io rejects sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (sentinel repo / no real coverage data)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
